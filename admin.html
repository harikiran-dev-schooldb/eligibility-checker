<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Panel – Fee Editor</title>
    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="logo-section">
        <img src="KOTAK_LOGO.png" alt="logo" />
        <h3>KOTAK SCHOOL</h3>
      </div>

      <nav>
        <a href="admissions.html">📊 Admissions Dashboard</a>
        <a href="index.html">🧮 Eligibility Checker</a>
        <a class="active" href="admin.html">🛠 Fee Editor</a>
      </nav>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="content">
      
      <!-- LOGIN BOX -->
      <div id="loginBox" class="login-card">
        <h2>🔐 Admin Login</h2>

        <input type="text" id="user" placeholder="Username" />
        <input type="password" id="pass" placeholder="Password" />
        
        <button class="btn-primary" onclick="login()">Login</button>
      </div>

      <!-- ADMIN PANEL -->
      <div id="adminPanel" style="display: none;">
        <div class="page-wrapper">

          <!-- HEADER -->
          <header class="top-header">
            <h2>🛠 Fee Editor</h2>
          </header>

          <!-- YEAR SELECTOR -->
          <div class="filter-bar">
            <div class="filter-group">
              <label>Select Academic Year:</label>
              <select id="yearSelect" onchange="loadFeeTable()">
                <option value="2023">2023–24</option>
                <option value="2024">2024–25</option>
                <option value="2025">2025–26</option>
              </select>
            </div>
          </div>

          <!-- FEE TABLE -->
          <div class="table-card">
            <table id="feeTable" class="admTable">
              <thead>
                <tr>
                  <th>Age</th>
                  <th>Class</th>
                  <th>Fees</th>
                  <th>Term Fee</th>
                </tr>
              </thead>
              <tbody id="feeTableBody"></tbody>
            </table>
          </div>

          <!-- SAVE SECTION -->
          <div class="saveBox">
            <input
              type="password"
              id="token"
              class="tokenBox"
              placeholder="GitHub PAT Token"
            />
            <button class="btn-primary" onclick="saveChanges()">
              💾 Save Changes
            </button>
          </div>

        </div>
      </div>

    </main>

    <!-- ========== SCRIPT LOADER (VERSIONED) ========== -->
    <script>
      const version = Date.now();

      ["data.js", "admin.js"].forEach(file => {
        const script = document.createElement("script");
        script.src = file + "?v=" + version;
        document.body.appendChild(script);
      });
    </script>

  </body>
</html>
